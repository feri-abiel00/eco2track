<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO₂Track - Physics & Scientific Digital Calculator</title>
    <!-- Firebase SDK v10 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .calculator-container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 5px;
            color: #2e7d32;
        }

        .subtitle {
            font-size: 0.85rem;
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .display-screen {
            background-color: #f1f8e9;
            border: 2px solid #a5d6a7;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            word-break: break-all;
        }

        .history-expr {
            font-size: 1rem;
            color: #757575;
            min-height: 1.2em;
        }

        .current-input {
            font-size: 2rem;
            font-weight: bold;
            color: #1b5e20;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 18px 10px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #f5f5f5;
            color: #333;
        }

            button:active {
                transform: scale(0.95);
            }

            button:hover {
                background-color: #e0e0e0;
            }

        .btn-sci {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

            .btn-sci:hover {
                background-color: #c8e6c9;
            }

        .btn-op {
            background-color: #fff3e0;
            color: #ef6c00;
            font-size: 1.4rem;
        }

            .btn-op:hover {
                background-color: #ffe0b2;
            }

        .btn-clear {
            background-color: #ffebee;
            color: #c62828;
        }

            .btn-clear:hover {
                background-color: #ffcdd2;
            }

        .btn-equal {
            background-color: #2e7d32;
            color: white;
            grid-column: span 1;
        }

            .btn-equal:hover {
                background-color: #1b5e20;
            }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2e7d32;
            font-size: 0.9rem;
            font-weight: 500;
        }

            .back-link:hover {
                text-decoration: underline;
            }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h1>ECO₂Track</h1>
        <div class="subtitle">Physics & Scientific Digital Calculator</div>

        <div class="display-screen">
            <div class="history-expr" id="history"></div>
            <div class="current-input" id="display">0</div>
        </div>

        <div class="grid-container">
            <!-- Row 1: Science -->
            <button class="btn-sci" onclick="appendFunc('sin')">sin</button>
            <button class="btn-sci" onclick="appendFunc('cos')">cos</button>
            <button class="btn-sci" onclick="appendFunc('tan')">tan</button>
            <button class="btn-sci" onclick="appendFunc('sqrt')">√</button>

            <!-- Row 2: Science & Clear -->
            <button class="btn-sci" onclick="appendOp('^')">^</button>
            <button class="btn-sci" onclick="appendConst('π')">π</button>
            <button class="btn-clear" onclick="clearDisplay()">AC</button>
            <button class="btn-op" onclick="appendOp('/')">÷</button>

            <!-- Row 3: Numbers & Op -->
            <button onclick="appendNum('7')">7</button>
            <button onclick="appendNum('8')">8</button>
            <button onclick="appendNum('9')">9</button>
            <button class="btn-op" onclick="appendOp('*')">×</button>

            <!-- Row 4: Numbers & Op -->
            <button onclick="appendNum('4')">4</button>
            <button onclick="appendNum('5')">5</button>
            <button onclick="appendNum('6')">6</button>
            <button class="btn-op" onclick="appendOp('-')">-</button>

            <!-- Row 5: Numbers & Op -->
            <button onclick="appendNum('1')">1</button>
            <button onclick="appendNum('2')">2</button>
            <button onclick="appendNum('3')">3</button>
            <button class="btn-op" onclick="appendOp('+')">+</button>

            <!-- Row 6: Zero, Dot, Equals -->
            <button style="grid-column: span 2;" onclick="appendNum('0')">0</button>
            <button onclick="appendNum('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>

        <a href="mp3.html" class="back-link">← Back to MP3 Hub</a>
    </div>

    <script>
        const display = document.getElementById('display');
        const history = document.getElementById('history');

        let currentInput = '0';
        let shouldReset = false;

        function updateDisplay() {
            display.innerText = currentInput;
        }

        function clearDisplay() {
            currentInput = '0';
            history.innerText = '';
            shouldReset = false;
            updateDisplay();
        }

        function appendNum(num) {
            if (currentInput === '0' && num !== '.') {
                currentInput = num;
            } else if (shouldReset) {
                currentInput = num === '.' ? '0.' : num;
                shouldReset = false;
            } else {
                if (num === '.' && currentInput.includes('.')) {
                    // Mencegah double titik desimal dalam satu bilangan konvensional langsung
                    // Implementasi sederhana
                    const tokens = currentInput.split(/[\+\-\*\/]/);
                    const lastToken = tokens[tokens.length - 1];
                    if (lastToken.includes('.')) return;
                }
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOp(op) {
            if (shouldReset) shouldReset = false;
            const lastChar = currentInput.trim().slice(-1);
            if (['+', '-', '*', '/', '^'].includes(lastChar)) {
                currentInput = currentInput.trim().slice(0, -1) + op;
            } else {
                currentInput += op;
            }
            updateDisplay();
        }

        function appendConst(constant) {
            if (currentInput === '0' || shouldReset) {
                currentInput = constant;
                shouldReset = false;
            } else {
                const lastChar = currentInput.slice(-1);
                if (!isNaN(lastChar) || lastChar === 'π') {
                    currentInput += '*' + constant;
                } else {
                    currentInput += constant;
                }
            }
            updateDisplay();
        }

        function appendFunc(func) {
            if (currentInput === '0' || shouldReset) {
                currentInput = func + '(';
                shouldReset = false;
            } else {
                const lastChar = currentInput.slice(-1);
                if (!isNaN(lastChar) || lastChar === 'π' || lastChar === ')') {
                    currentInput += '*' + func + '(';
                } else {
                    currentInput += func + '(';
                }
            }
            updateDisplay();
        }

        function calculate() {
            try {
                let expr = currentInput;

                // Hitung jumlah kurung buka dan tutup otomatis jika user lupa menutup
                const openBrackets = (expr.match(/\(/g) || []).length;
                const closeBrackets = (expr.match(/\)/g) || []).length;
                if (openBrackets > closeBrackets) {
                    expr += ')'.repeat(openBrackets - closeBrackets);
                }

                history.innerText = expr;

                // Ganti representasi string agar aman di-eval atau diolah secara matematis
                let evalExpr = expr
                    .replace(/π/g, 'Math.PI')
                    .replace(/sin\(([^)]+)\)/g, (match, p1) => {
                        return `Math.sin(${p1} * Math.PI / 180)`; // Menggunakan Derajat (Degree)
                    })
                    .replace(/cos\(([^)]+)\)/g, (match, p1) => {
                        return `Math.cos(${p1} * Math.PI / 180)`;
                    })
                    .replace(/tan\(([^)]+)\)/g, (match, p1) => {
                        return `Math.tan(${p1} * Math.PI / 180)`;
                    })
                    .replace(/sqrt\(([^)]+)\)/g, 'Math.sqrt($1)');

                // Penanganan pangkat ^ sederhanakan dengan Math.pow atau eval modern **
                // Deteksi pola angka^angka
                evalExpr = evalExpr.replace(/(\d+)\^(\d+)/g, 'Math.pow($1,$2)');

                // Evaluasi ekspresi aritmatika dasar aman
                let result = Function('"use strict";return (' + evalExpr + ')')();

                if (isNaN(result) || !isFinite(result)) {
                    currentInput = 'Error';
                } else {
                    // Membatasi angka di belakang koma agar rapi
                    currentInput = Number(result.toFixed(8)).toString();

                    // Record calculation to Firebase Firestore
                    if (window.EcoTrackFirebase && window.EcoTrackFirebase.isInitialized && currentExpression) {
                        window.EcoTrackFirebase.recordCalculation({
                            type: 'physics_math_calculation',
                            expression: currentExpression,
                            result: currentInput,
                            timestamp: new Date().toISOString()
                        });
                    }
                }
            } catch (error) {
                currentInput = 'Error';
            }
            shouldReset = true;
            updateDisplay();
        }
    </script>

</body>
</html>
